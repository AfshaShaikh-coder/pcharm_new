name: Python CI

on:
  push:
    branches: [ "main" ]  # CI runs when you push to main branch

jobs:
  build:
    runs-on: ubuntu-latest  # virtual environment

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install pytest

    - name: Run tests
      run: pytest
